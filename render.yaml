services:
  # Go Backend API
  - type: web
    name: clockworth-api
    env: go
    plan: free
    buildCommand: |
      go install github.com/amacneil/dbmate/v2@latest
      go build -tags netgo -ldflags '-s -w' -o app
      $(go env GOPATH)/bin/dbmate up
    startCommand: ./app
    healthCheckPath: /health
    autoDeploy: true
    branch: main
    buildFilter:
      ignoredPaths:
        - web/**
        - docs/**
        - README*.md
