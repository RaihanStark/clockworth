version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: clockworth-db
    environment:
      POSTGRES_USER: clockworth
      POSTGRES_PASSWORD: clockworth_dev_password
      POSTGRES_DB: clockworth
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clockworth"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
