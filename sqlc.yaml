version: "2"
sql:
  - schema: "db/schema.sql"
    queries: "db/queries"
    engine: "postgresql"
    gen:
      go:
        package: "database"
        out: "internal/database"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: false
        emit_exact_table_names: false
        overrides:
          - column: "users.hourly_worth"
            go_type: "float64"
